[package]
name = "rinhudos-backend-2025"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/bin/api.rs"


[dependencies]
actix-web = "4"
serde_with = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.46.1", features = ["full"] }
reqwest = { version = "0.12.22", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.31"
anyhow = "1.0.98"
bytes = "1.5.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
